name: CI

on:
  workflow_dispatch:
    inputs:
      mt:
        description: Enable multithreaded MSBuild
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      RUNFILE_EXPERIMENT_MT: ${{ inputs.mt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100
      - name: SDK and runner
        run: dotnet --info
      - name: Install HTTPS development certificate
        run: dotnet dev-certs https --verbose
        continue-on-error: true
      - name: Test verification dependency grouping
        shell: bash
        run: |
          if [ "$RUNFILE_EXPERIMENT_MT" = true ]; then
            dotnet verify.cs -mt -- --self-test
          else
            dotnet verify.cs -- --self-test
          fi
      - name: Run verification script
        shell: bash
        run: |
          if [ "$RUNFILE_EXPERIMENT_MT" = true ]; then
            dotnet verify.cs -mt --parallel --timeout 400
          else
            dotnet verify.cs --parallel --timeout 400
          fi
